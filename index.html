<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ウポポ輪唱リズムゲーム</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee9dc;color:#222;font-family:system-ui,"Yu Gothic",sans-serif;text-align:center}
h1{font-size:28px;margin:16px 8px 4px}.sub{color:#666;margin:0 8px 10px}
#start{font-size:21px;padding:13px 30px;border:0;border-radius:14px;cursor:pointer;background:#fff}
#game{display:block}
#countdown{height:78px;padding:10px}.countText{font-size:30px;font-weight:bold}
#score{font-size:23px;font-weight:bold;margin:2px}
#beat{height:34px;font-size:22px;font-weight:bold}
.stage{position:relative;width:min(700px,94vw);aspect-ratio:1;margin:0 auto}
.shintoko{
 position:absolute;left:50%;top:50%;width:68%;height:68%;
 transform:translate(-50%,-50%);background:#050505;border-radius:50%;
 box-shadow:0 0 0 9px #333;
}
.player{position:absolute;width:150px;z-index:5}
.playerName{font-size:18px;font-weight:bold;background:#fff;border-radius:8px;padding:3px 8px;margin-bottom:3px}
.status{height:30px;font-size:19px;font-weight:bold;color:#777}
.pad{display:block;margin:auto;width:82px;height:82px;border-radius:50%;
 background:#d71920;border:7px solid #851018;cursor:pointer;
 transition:transform .08s,background .08s,box-shadow .08s}
.player.active .pad{box-shadow:0 0 0 3px #888}
.player.flash .pad{background:#fff15a;border-color:#fff;box-shadow:0 0 34px 14px #ffd500;transform:scale(1.13)}
.player.flash .playerName{background:#fff15a}
#player1{left:50%;top:17%;transform:translate(-50%,-50%)}
#player2{left:29%;top:66%;transform:translate(-50%,-50%)}
#player3{left:71%;top:66%;transform:translate(-50%,-50%)}
#result{display:none;width:min(620px,90vw);margin:15px auto;padding:25px;background:white;border-radius:16px;font-size:22px}
#resultScore{font-size:30px;font-weight:bold;margin:12px}
#again{font-size:18px;padding:10px 24px;border:0;border-radius:10px;margin-top:12px}
.lyrics{width:min(700px,90vw);margin:8px auto;padding:12px;background:#fff;border-radius:14px}
#ainu{font-size:22px;font-weight:bold}#roman{color:#666}#jp{font-size:17px;margin-top:4px}
.info{font-size:13px;color:#666;margin:7px}
</style>
</head>
<body>
<h1>チュㇷ゚カー ワー　カームイ ラン</h1>
<div class="sub">3人でつくるウポポ輪唱リズムゲーム</div>
<button id="start">▶ スタート</button>

<div id="game">
 <div id="countdown"><div class="countText" id="countText"></div></div>
 <div id="score">スコア：0</div>
 <div id="beat">準備</div>

 <div class="stage">
  <div class="shintoko"></div>

  <div class="player" id="player1">
   <div class="playerName">プレイヤー1</div>
   <div class="status" id="status1">音源</div>
   <button class="pad" id="pad1" aria-label="プレイヤー1"></button>
  </div>

  <div class="player" id="player2">
   <div class="playerName">プレイヤー2</div>
   <div class="status" id="status2">待機</div>
   <button class="pad" id="pad2" aria-label="プレイヤー2"></button>
  </div>

  <div class="player" id="player3">
   <div class="playerName">プレイヤー3</div>
   <div class="status" id="status3">待機</div>
   <button class="pad" id="pad3" aria-label="プレイヤー3"></button>
  </div>
 </div>

 <div class="lyrics">
  <div id="ainu">スタートすると音源が始まります</div>
  <div id="roman">cupka wa kamuy ran</div>
  <div id="jp">東の方から神が降りてきて</div>
 </div>
 <div class="info">音源の拍に合わせて強・弱が切り替わります</div>
 <audio id="audio" src="chupka_wa_kamuy_ran.m4a" preload="auto"></audio>
</div>

<div id="result">
 <div>🎉 結果発表 🎉</div>
 <div id="resultScore">スコア：0</div>
 <div>おつかれさまでした！</div>
 <button id="again">もう一度</button>
</div>

<script>
/* 音源の波形から、冒頭約4.1秒の前奏（拍）後に歌が始まることを確認。
   歌の2拍周期は約0.5秒/拍。
   P2は「チュㇷ゚カー ワー」の終了後、P3は「カームイ ラン」の終了後に開始。 */
const PLAYER2_START=4.70;
const PLAYER3_START=5.72;
const BEATS=[0.416,0.896,1.376,1.856,2.304,2.752,3.232,3.712,4.192,4.704,5.184,5.664,6.144,6.624,7.072,7.552,8.032,8.544,8.992,9.440,9.888,10.336,10.816,11.296,11.776,12.288,12.768,13.248,13.696,14.176,14.624,15.104,15.584,16.032,16.480,16.992,17.440,17.920,18.400,18.880,19.360,19.840,20.288,20.768,21.248,21.728,22.176,22.624,23.136,23.584,24.032,24.512,24.992,25.504,25.952,26.400,26.848,27.328,27.808,28.256,28.736,29.248,29.728,30.176,30.656,31.136,31.584];
const HIT_WINDOW=220;

const audio=document.getElementById("audio");
const start=document.getElementById("start");
const again=document.getElementById("again");
const game=document.getElementById("game");
const result=document.getElementById("result");
const countText=document.getElementById("countText");
const beatText=document.getElementById("beat");
const scoreText=document.getElementById("score");
const players=[1,2,3].map(i=>document.getElementById("player"+i));
const statuses=[1,2,3].map(i=>document.getElementById("status"+i));
const pads=[1,2,3].map(i=>document.getElementById("pad"+i));

let running=false,score=0,beatNo=-1,lastFlash=false,hitAt=0;
let active=[true,false,false],beatTimer=null,raf=null;

function reset(){
 running=false; clearInterval(beatTimer); cancelAnimationFrame(raf);
 audio.pause(); audio.currentTime=0;
 game.style.display="block"; result.style.display="none"; start.style.display="inline-block";
 players.forEach((p,i)=>{p.classList.remove("active","flash");statuses[i].textContent=i===0?"音源":"待機"});
 countText.textContent=""; beatText.textContent="準備"; scoreText.textContent="スコア：0";
 active=[true,false,false]; score=0; beatNo=-1;
}

function countdown(){
 return new Promise(resolve=>{
  const words=["１（シネプ）","２（トゥ）","３（レ）","シノッチャケ アン ロー"];
  let i=0;
  function step(){
   countText.textContent=words[i++];
   if(i<words.length)setTimeout(step,1000);
   else setTimeout(()=>{countText.textContent="";resolve()},1000);
  }
  step();
 });
}

function flash(on){
 lastFlash=on;
 players.forEach((p,i)=>p.classList.toggle("flash",on&&active[i]));
 beatText.textContent=on?"● １拍目（強）":"○ ２拍目（弱）";
 hitAt=performance.now();
}

function updateBeatFromAudio(){
 if(!running)return;
 const t=audio.currentTime;
 let i=0;
 while(i+1<BEATS.length && BEATS[i+1]<=t)i++;
 if(t<BEATS[0]) return;
 if(i!==beatNo){
   beatNo=i;
   const strong=(i%2===0);
   flash(strong);
 }
}

function announcePlayer(i){
 active[i]=true;
 players[i].classList.add("active");
 statuses[i].textContent="開始！";
 setTimeout(()=>{if(running)statuses[i].textContent="参加中"},1200);
}

function setLyrics(ainu, roman, jp){
 document.getElementById("ainu").textContent=ainu;
 document.getElementById("roman").textContent=roman;
 document.getElementById("jp").textContent=jp;
}

function sync(){
 if(!running)return;
 const t=audio.currentTime;
 updateBeatFromAudio();

 if(!active[1] && t>=PLAYER2_START)announcePlayer(1);
 if(!active[2] && t>=PLAYER3_START)announcePlayer(2);

 // 実音源のフレーズ境界に合わせて歌詞を表示
 if(t < 4.20){
   setLyrics("まもなく開始", "", "");
 }else if(t < 5.70){
   setLyrics("チュㇷ゚カー ワー", "cupka wa", "東の方から");
 }else if(t < 7.90){
   setLyrics("カームイ ラン", "kamuy ran", "神が降りてきて");
 }else if(t < 9.40){
   setLyrics("イーワニ テッ カ オーレウ", "iwani tek ka orew", "アオダモの枝に留まった");
 }else if(t < 11.70){
   setLyrics("イーワ トゥイサㇺ", "iwa tuysam", "岩山のそばで");
 }else{
   setLyrics("エータンネー マウ アーヌー", "etanne maw a=nu", "その長い響きを私たちは聞く");
 }
 raf=requestAnimationFrame(sync);
}

pads.forEach((p,i)=>p.addEventListener("pointerdown",()=>hit(i)));

async function startGame(){
 reset();
 start.style.display="none";game.style.display="block";
 players[0].classList.add("active");
 running=true;
 await countdown();
 if(!running)return;

 try{
  audio.currentTime=0;
  await audio.play();
 }catch(e){
  alert("音源を再生できませんでした。GitHub Pages上でページを再読み込みして、もう一度スタートしてください。");
  reset();return;
 }

 beatNo=-1;
 sync();
}

function finish(){
 if(!running)return;
 running=false;clearInterval(beatTimer);cancelAnimationFrame(raf);
 players.forEach(p=>p.classList.remove("flash"));
 result.style.display="block";
 document.getElementById("resultScore").textContent="スコア："+score;
}

audio.addEventListener("ended",finish);
start.addEventListener("click",startGame);
again.addEventListener("click",startGame);
reset();
</script>
</body>
</html>
